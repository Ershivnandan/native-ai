name: Production Build & Submit

on:
  push:
    branches: [master]

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  android_build:
    name: Android Build & Submit to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Load Play Store service account key
        run: echo "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}" | base64 -d > google-service-account.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB locally
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=4"
        run: |
          eas build --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output android-build.aab

      - name: Submit to Play Store
        run: |
          eas submit \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --path android-build.aab

      - name: Cleanup credentials
        if: always()
        run: rm -f google-service-account.json

      - name: Post build summary
        run: echo "✅ Production AAB submitted to Play Store" >> $GITHUB_STEP_SUMMARY
