name: Staging Build

on:
  push:
    branches: [staging]

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  android_build:
    name: Android Staging Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install sharp for icon badging
        run: bun add -d sharp

      - name: Badge app icon with STAGING
        run: node scripts/badge-icon.js STAGING

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK locally
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=4"
        run: |
          eas build --platform android \
            --profile staging \
            --local \
            --non-interactive \
            --output android-staging.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: android-staging.apk
          retention-days: 14

      - name: Load Play Store service account key
        run: echo "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}" | base64 -d > google-service-account.json

      - name: Submit to Play Store internal track
        run: |
          eas submit \
            --platform android \
            --profile staging \
            --non-interactive \
            --no-wait \
            --path android-staging.apk

      - name: Cleanup credentials
        if: always()
        run: rm -f google-service-account.json

      - name: Post build summary
        run: echo "✅ Staging APK built and submitted to Play Store internal track." >> $GITHUB_STEP_SUMMARY
